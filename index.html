<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='18' font-weight='800' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080d18" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Recruiter Talent AI — an AI-assisted recruitment workspace. AI ranks and summarises candidates; humans make every hiring decision."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Recruiter Talent AI — AI-assisted hiring workspace</title>

    <!--
      Theme is applied before first paint to prevent a flash of the wrong theme
      and to avoid layout shift (CLS) caused by late style recalculation.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('recruiter-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored ? stored === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>

    <style>
      /* Critical shell styles: paint the correct background immediately (LCP/CLS). */
      html {
        background-color: #f8fafc;
      }
      html.dark {
        background-color: #080d18;
      }
      body {
        margin: 0;
      }
      #root {
        min-height: 100%;
      }
    </style>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
